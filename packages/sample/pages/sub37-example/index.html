<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Test page</title>
		<link href="style.css" rel="stylesheet" />
	</head>
	<body>
		<main>
				<scheduled-textarea placeholder="WEBVTT..."></scheduled-textarea>
				<div id="video-container">
					<fake-video controls></fake-video>
					<captions-renderer id="presenter"></captions-renderer>
				</div>
			</div>
			<!-- form id and input names are hardcoded inside the code -->
			<form id="content-type" is="processor-selector">
				<h4>Content type:</h4>
				<div>
					<input type="radio" id="webvtt" name="caption-type" value="text/vtt" checked />
					<label for="webvtt">WebVTT (text/vtt)</label>
					<a href="#" data-load-sample="webvtt">(load sample)</a>
				</div>
				<div>
					<input type="radio" id="ttml" name="caption-type" value="application/ttml+xml" />
					<label for="ttml">TTML (application/ttml+xml)</label>
					<a href="#" data-load-sample="ttml">(load sample)</a>
				</div>
				<div>
					<!-- <input type="radio" id="ttml" name="caption-type" value="text/xml+ttml" />
					<label for="ttml">TTML (text/xml+ttml)</label> -->
				</div>
			</form>
			<form id="renderer-settings">
				<h4>Renderer settings:</h4>
				<div class="settings-columns">
					<div class="settings-column">
						<div>
							<label for="lines">Lines:</label>
							<input type="number" id="lines" name="lines" value="2" min="1" />
						</div>
						<div>
							<input type="checkbox" id="shiftDownFirstLine" name="shiftDownFirstLine" />
							<label for="shiftDownFirstLine">Shift down first line</label>
						</div>
						<div>
							<input type="checkbox" id="snapHeightToLineGrid" name="snapHeightToLineGrid" checked />
							<label for="snapHeightToLineGrid">Snap height to line grid</label>
						</div>
					</div>
					<div class="settings-column">
						<div>
							<label for="css-text-color">Text color</label>
							<div class="color-with-alpha">
								<input type="color" id="css-text-color" name="--sub37-text-color" />
								<input type="range" min="0" max="1" step="0.01" value="1" data-alpha-for="--sub37-text-color" />
							</div>
							<button type="button" data-css-var="--sub37-text-color">Reset</button>
						</div>
						<div>
							<label for="css-text-bg-color">Text BG color</label>
							<div class="color-with-alpha">
								<input type="color" id="css-text-bg-color" name="--sub37-text-bg-color" />
								<input type="range" min="0" max="1" step="0.01" value="1" data-alpha-for="--sub37-text-bg-color" />
							</div>
							<button type="button" data-css-var="--sub37-text-bg-color">Reset</button>
						</div>
						<div>
							<label for="css-region-bg-color">Region BG color</label>
							<div class="color-with-alpha">
								<input type="color" id="css-region-bg-color" name="--sub37-region-bg-color" />
								<input type="range" min="0" max="1" step="0.01" value="1" data-alpha-for="--sub37-region-bg-color" />
							</div>
							<button type="button" data-css-var="--sub37-region-bg-color">Reset</button>
						</div>
						<div>
							<label for="css-region-area-bg-color">Region area BG color</label>
							<div class="color-with-alpha">
								<input type="color" id="css-region-area-bg-color" name="--sub37-region-area-bg-color" />
								<input type="range" min="0" max="1" step="0.01" value="1" data-alpha-for="--sub37-region-area-bg-color" />
							</div>
							<button type="button" data-css-var="--sub37-region-area-bg-color">Reset</button>
						</div>
						<div>
							<label for="css-bottom-spacing">Bottom spacing</label>
							<input type="range" id="css-bottom-spacing" name="--sub37-bottom-spacing" min="0" max="100" value="0" data-unit="px" />
							<button type="button" data-css-var="--sub37-bottom-spacing">Reset</button>
						</div>
						<div>
							<label for="css-bottom-transition">Bottom transition</label>
							<input type="range" id="css-bottom-transition" name="--sub37-bottom-transition" min="0" max="100" value="0" data-unit="ms" />
							<button type="button" data-css-var="--sub37-bottom-transition">Reset</button>
						</div>
						<div>
							<label for="css-span-padding-x">Span padding X</label>
							<input type="range" id="css-span-padding-x" name="--sub37-span-padding-x" min="0" max="100" value="15" data-unit="px" />
							<button type="button" data-css-var="--sub37-span-padding-x">Reset</button>
						</div>
					</div>
				</div>
			</form>
		</main>
		<script type="module" src="script.mjs"></script>
	</body>
</html>
